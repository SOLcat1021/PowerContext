    - env
    - POWERCONTEXT_BASE_URL
    value: http://127.0.0.1:18180
    value_type: string
  - description: bootstrap_powercontext.py 返回的实际 scope_id，不是幂等键
    id: echoes-powercontext-scope
    name: POWERCONTEXT_SCOPE_ID
    selector:
    - env
    - POWERCONTEXT_SCOPE_ID
